model:
  vocab_size: 151666
  d_model: 768
  n_layer: 12
  n_head: 12
  n_kv_head: 4
  d_ff: 2048
  ctx_len: 2048
  dropout: 0.0
  tie_embeddings: true
data:
  tokenizer_kind: qwen
  tokenizer_dir: data/tokenizer/qwen2.5-0.5b
  train_bin: data/processed/text/fineweb_cmn.train.bin
  val_bin: data/processed/text/fineweb_cmn.val.bin
  hf_endpoint: ""
  proxy: "http://127.0.0.1:7890"
train:
  batch_size: 1
  grad_accum: 64
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 100
  max_steps: 2000
  eval_interval: 250
  save_interval: 500
  log_interval: 20
  out_dir: out/gpt_pretrain
  dtype: bf16
  compile: false
  seed: 42
