model:
  vocab_size: 16384
  d_model: 768
  n_layer: 12
  n_head: 12
  n_kv_head: 4
  d_ff: 2048
  ctx_len: 1024
  dropout: 0.0
  tie_embeddings: true
data:
  tokenizer_kind: bpe
  tokenizer_dir: data/tokenizer/bpe_16k
  train_bin: data/processed/text/train.bin
  val_bin: data/processed/text/val.bin
train:
  batch_size: 8
  grad_accum: 8
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 200
  max_steps: 20000
  eval_interval: 250
  save_interval: 1000
  log_interval: 20
  out_dir: out/gpt_bpe
  dtype: bf16
  compile: false
  seed: 42
