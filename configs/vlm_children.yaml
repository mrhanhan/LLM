gpt_ckpt: out/gpt/latest.pt
data_kind: synthetic          # synthetic | children
use_qa: false
num_samples: 20000
vlm:
  d_vision: 384
  depth: 6
  n_head: 6
  img_size: 128
  patch_size: 16
model:
  vocab_size: 151666          # Qwen2.5-0.5B + <image>；运行时仍会被实际词表覆盖
  d_model: 768
  n_layer: 12
  n_head: 12
  n_kv_head: 4
  d_ff: 2048
  ctx_len: 1024
data:
  tokenizer_kind: qwen
  tokenizer_dir: data/tokenizer/qwen2.5-0.5b
train:
  batch_size: 8
  grad_accum: 2
  lr: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 100
  max_steps: 4000
  eval_interval: 200
  save_interval: 500
  log_interval: 10
  out_dir: out/vlm
  dtype: bf16
  compile: false
  seed: 42
